<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Phase 1A 连续行为审计</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="title-block">
          <p class="eyebrow">SPX / Phase 1A</p>
          <h1>连续行为审计</h1>
        </div>
        <div class="dataset-meta" id="dataset-meta" aria-live="polite"></div>
      </header>

      <section class="control-band" aria-label="回放控制">
        <div class="control-group" aria-label="时间导航">
          <div class="playback-controls">
            <button class="icon-button" id="previous-button" type="button" title="前一个交易日（左方向键）" aria-label="前一个交易日">
              <i data-lucide="chevron-left" aria-hidden="true"></i>
            </button>
            <button class="icon-button" id="play-button" type="button" title="播放回放（空格键）" aria-label="播放回放">
              <i data-lucide="play" aria-hidden="true"></i>
            </button>
            <button class="icon-button" id="next-button" type="button" title="后一个交易日（右方向键）" aria-label="后一个交易日">
              <i data-lucide="chevron-right" aria-hidden="true"></i>
            </button>
          </div>

          <label class="date-control" for="as-of-input">
            <span>AS OF</span>
            <input id="as-of-input" type="date" />
          </label>

          <div class="range-controls" aria-label="观察范围">
            <button type="button" data-range-bars="63">3M</button>
            <button type="button" data-range-bars="126">6M</button>
            <button type="button" data-range-bars="252" aria-pressed="true">1Y</button>
            <button type="button" data-range-bars="756">3Y</button>
          </div>
        </div>

        <span class="control-divider" aria-hidden="true"></span>

        <div class="control-group scale-group" aria-label="价格轴尺度">
          <span class="control-label">价格轴</span>
          <div class="segmented-control" aria-label="价格轴尺度">
            <button type="button" data-price-scale="log" aria-pressed="true">Log</button>
            <button type="button" data-price-scale="linear">Linear</button>
          </div>
        </div>

        <span class="control-divider" aria-hidden="true"></span>

        <div class="control-group scale-group" aria-label="指标轴尺度">
          <span class="control-label">指标轴</span>
          <div class="segmented-control" aria-label="指标轴尺度">
            <button type="button" data-indicator-scale="auto" aria-pressed="true">Auto</button>
            <button type="button" data-indicator-scale="fixed">0-1</button>
          </div>
        </div>
      </section>

      <section class="workspace" aria-label="连续行为图表">
        <div class="chart-stack">
          <section class="chart-panel price-panel" aria-labelledby="price-heading">
            <div class="panel-heading">
              <div>
                <p class="panel-kicker">基础价格过程</p>
                <h2 id="price-heading">SPX 日线</h2>
              </div>
              <span class="as-of-readout" id="as-of-readout"></span>
            </div>
            <div class="chart-frame" id="price-frame">
              <div class="chart-surface" id="price-chart"></div>
              <span class="sync-time-marker" id="price-time-marker" aria-hidden="true"></span>
            </div>
          </section>

          <section class="chart-panel efficiency-panel" aria-labelledby="efficiency-heading">
            <div class="panel-heading panel-heading-compact">
              <div>
                <p class="panel-kicker">多尺度连续行为</p>
                <h2 id="efficiency-heading">OHLC-min 效率</h2>
              </div>
              <fieldset class="efficiency-toggles" aria-label="效率窗口显示">
                <label><input type="checkbox" data-window="5" checked /><span class="swatch efficiency-5"></span>5</label>
                <label><input type="checkbox" data-window="10" checked /><span class="swatch efficiency-10"></span>10</label>
                <label><input type="checkbox" data-window="20" checked /><span class="swatch efficiency-20"></span>20</label>
                <label><input type="checkbox" data-window="55" checked /><span class="swatch efficiency-55"></span>55</label>
              </fieldset>
            </div>
            <div class="chart-frame efficiency-frame" id="efficiency-frame">
              <div class="chart-surface" id="efficiency-chart"></div>
              <span class="sync-time-marker" id="efficiency-time-marker" aria-hidden="true"></span>
            </div>
          </section>
        </div>

        <aside class="snapshot-panel" aria-labelledby="snapshot-heading">
          <div class="snapshot-heading">
            <p class="panel-kicker">窗口快照</p>
            <h2 id="snapshot-heading">当前尺度</h2>
          </div>
          <dl class="snapshot-values" id="snapshot-values"></dl>
        </aside>
      </section>

      <div class="loading-state" id="loading-state" role="status">正在加载冻结研究数据</div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

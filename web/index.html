<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Phase 1A 连续行为审计</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="chrome" aria-label="顶部工具栏">
        <div class="chrome-left">
          <h1>连续行为审计</h1>
          <div class="dataset-meta" id="dataset-meta" aria-live="polite"></div>
        </div>

        <div class="chrome-controls" aria-label="回放控制">
          <div class="playback-controls">
            <button class="icon-button" id="previous-button" type="button" title="前一个交易日（左方向键）" aria-label="前一个交易日">
              <i data-lucide="chevron-left" aria-hidden="true"></i>
            </button>
            <button class="icon-button" id="play-button" type="button" title="播放回放（空格键）" aria-label="播放回放">
              <i data-lucide="play" aria-hidden="true"></i>
            </button>
            <button class="icon-button" id="next-button" type="button" title="后一个交易日（右方向键）" aria-label="后一个交易日">
              <i data-lucide="chevron-right" aria-hidden="true"></i>
            </button>
          </div>

          <label class="date-control" for="as-of-input">
            <span>AS OF</span>
            <input id="as-of-input" type="date" />
          </label>

          <div class="range-controls" aria-label="观察范围">
            <button type="button" data-range-bars="63">3M</button>
            <button type="button" data-range-bars="126">6M</button>
            <button type="button" data-range-bars="252" aria-pressed="true">1Y</button>
            <button type="button" data-range-bars="756">3Y</button>
          </div>

          <span class="control-divider" aria-hidden="true"></span>

          <div class="segmented-control" aria-label="价格轴尺度">
            <button type="button" data-price-scale="log" aria-pressed="true">Log</button>
            <button type="button" data-price-scale="linear">Lin</button>
          </div>

          <div class="segmented-control" aria-label="效率与双向性轴尺度">
            <button type="button" data-indicator-scale="auto" aria-pressed="true">Auto</button>
            <button type="button" data-indicator-scale="fixed">0-1</button>
          </div>

          <button class="icon-button" id="snapshot-toggle" type="button" title="折叠/展开快照栏" aria-label="折叠快照栏" aria-pressed="true">
            <i data-lucide="panel-right" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <section class="workspace" aria-label="连续行为图表">
        <div class="chart-board">
          <section class="pane price-pane" aria-label="SPX 日线">
            <div class="pane-chart" id="price-frame">
              <div class="chart-legend" id="price-legend"></div>
              <div class="chart-surface" id="price-chart"></div>
              <span class="sync-time-marker" id="price-time-marker" aria-hidden="true"></span>
            </div>
          </section>

          <section class="pane feature-pane" aria-label="效率 E">
            <div class="pane-chart" id="efficiency-frame">
              <div class="chart-legend" id="efficiency-legend" data-feature="efficiency"></div>
              <div class="chart-surface" id="efficiency-chart"></div>
              <span class="sync-time-marker" id="efficiency-time-marker" aria-hidden="true"></span>
            </div>
          </section>

          <section class="pane feature-pane" aria-label="方向 D">
            <div class="pane-chart" id="direction-frame">
              <div class="chart-legend" id="direction-legend" data-feature="direction"></div>
              <div class="chart-surface" id="direction-chart"></div>
              <span class="sync-time-marker" id="direction-time-marker" aria-hidden="true"></span>
            </div>
          </section>

          <section class="pane feature-pane bottom-pane" aria-label="双向性 B">
            <div class="pane-chart" id="two-sidedness-frame">
              <div class="chart-legend" id="two-sidedness-legend" data-feature="twoSidedness"></div>
              <div class="chart-surface" id="two-sidedness-chart"></div>
              <span class="sync-time-marker" id="two-sidedness-time-marker" aria-hidden="true"></span>
            </div>
          </section>
        </div>

        <aside class="snapshot-panel" id="snapshot-panel" aria-labelledby="snapshot-heading">
          <div class="snapshot-heading">
            <h2 id="snapshot-heading">当前读数</h2>
            <span class="as-of-readout" id="as-of-readout"></span>
          </div>
          <dl class="snapshot-values" id="snapshot-values"></dl>
        </aside>
      </section>

      <div class="loading-state" id="loading-state" role="status">正在加载冻结研究数据</div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Phase 1A 连续行为审计</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="chrome" aria-label="顶部工具栏">
        <div class="chrome-left">
          <h1>连续行为审计</h1>
          <div class="dataset-meta" id="dataset-meta" aria-live="polite"></div>
        </div>

        <div class="chrome-controls" aria-label="回放控制">
          <div class="segmented-control" aria-label="观察模式">
            <button type="button" data-view-mode="continuous" aria-pressed="true">连续指标</button>
            <button type="button" data-view-mode="coupling">组合观察</button>
          </div>
          <div class="playback-controls">
            <button class="icon-button" id="previous-button" type="button" title="前一个交易日（左方向键）" aria-label="前一个交易日">
              <i data-lucide="chevron-left" aria-hidden="true"></i>
            </button>
            <button class="icon-button" id="play-button" type="button" title="播放回放（空格键）" aria-label="播放回放">
              <i data-lucide="play" aria-hidden="true"></i>
            </button>
            <button class="icon-button" id="next-button" type="button" title="后一个交易日（右方向键）" aria-label="后一个交易日">
              <i data-lucide="chevron-right" aria-hidden="true"></i>
            </button>
          </div>

          <label class="date-control" for="as-of-input">
            <span>AS OF</span>
            <input id="as-of-input" type="date" />
          </label>

          <div class="range-controls" aria-label="观察范围">
            <button type="button" data-range-bars="63">3M</button>
            <button type="button" data-range-bars="126">6M</button>
            <button type="button" data-range-bars="252" aria-pressed="true">1Y</button>
            <button type="button" data-range-bars="756">3Y</button>
          </div>

          <span class="control-divider" aria-hidden="true"></span>

          <div class="segmented-control" aria-label="价格轴尺度">
            <button type="button" data-price-scale="log" aria-pressed="true">Log</button>
            <button type="button" data-price-scale="linear">Lin</button>
          </div>

          <div class="segmented-control" aria-label="0 到 1 指标轴尺度">
            <button type="button" data-indicator-scale="auto" aria-pressed="true">Auto</button>
            <button type="button" data-indicator-scale="fixed">0-1</button>
          </div>

          <div class="pane-toggle-group" aria-label="副图显示控制">
            <button type="button" data-pane-toggle="efficiency" aria-pressed="true" title="显示或隐藏效率 E">E</button>
            <button type="button" data-pane-toggle="direction" aria-pressed="true" title="显示或隐藏方向 D">D</button>
            <button type="button" data-pane-toggle="twoSidedness" aria-pressed="true" title="显示或隐藏双向性 B">B</button>
            <button type="button" data-pane-toggle="expansion" aria-pressed="true" title="显示或隐藏当日扩张 X">X</button>
            <button type="button" data-pane-toggle="clearance" aria-pressed="true" title="显示或隐藏旧区位置 CL">CL</button>
          </div>

          <button class="icon-button" id="snapshot-toggle" type="button" title="折叠/展开快照栏" aria-label="折叠快照栏" aria-pressed="true">
            <i data-lucide="panel-right" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <section class="coupling-toolbar" id="coupling-toolbar" hidden aria-label="组合观察筛选">
        <select id="regime-filter" aria-label="背景筛选">
          <option value="">全部背景</option>
          <option value="DIRECTIONAL_UP">方向向上</option>
          <option value="DIRECTIONAL_DOWN">方向向下</option>
          <option value="BALANCE_LIKE">偏盘整</option>
          <option value="UNRESOLVED">看不清</option>
        </select>
        <select id="event-filter" aria-label="事件筛选">
          <option value="">全部事件</option>
          <option value="EXPANSION_UP">向上扩张</option>
          <option value="EXPANSION_DOWN">向下扩张</option>
          <option value="TURBULENT_SHOCK">剧烈无方向</option>
        </select>
        <label class="check-control"><input id="change-filter" type="checkbox" /> 只看背景变化</label>
        <button class="icon-button" id="previous-match" type="button" title="上一个同类日期" aria-label="上一个同类日期"><i data-lucide="skip-back" aria-hidden="true"></i></button>
        <button class="icon-button" id="next-match" type="button" title="下一个同类日期" aria-label="下一个同类日期"><i data-lucide="skip-forward" aria-hidden="true"></i></button>
        <span class="control-divider" aria-hidden="true"></span>
        <div class="segmented-control step-control" aria-label="逐步增加信息">
          <button type="button" data-info-step="1">1 D+A</button>
          <button type="button" data-info-step="2">2 +E</button>
          <button type="button" data-info-step="3">3 +争夺</button>
          <button type="button" data-info-step="4">4 +X</button>
          <button type="button" data-info-step="5" aria-pressed="true">5 +位置</button>
        </div>
        <span class="match-count" id="match-count"></span>
      </section>

      <section class="workspace" aria-label="连续行为图表">
        <div class="chart-board">
          <section class="pane price-pane" data-pane-key="price" aria-label="SPX 日线">
            <div class="pane-chart" id="price-frame">
              <div class="chart-legend" id="price-legend"></div>
              <div class="chart-surface" id="price-chart"></div>
              <span class="sync-time-marker" id="price-time-marker" aria-hidden="true"></span>
            </div>
          </section>

          <div class="pane-resizer coupling-only" data-pane-resizer="state" role="separator" aria-hidden="true"></div>
          <section class="pane state-pane coupling-only" data-pane-key="state" aria-label="背景候选与事件" hidden>
            <div class="pane-chart" id="state-frame">
              <div class="chart-legend" id="state-legend"></div>
              <div class="chart-surface" id="state-chart"></div>
              <span class="sync-time-marker" id="state-time-marker" aria-hidden="true"></span>
            </div>
          </section>

          <div class="pane-resizer" data-pane-resizer="efficiency" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="调整效率窗格高度"></div>
          <section class="pane feature-pane" data-pane-key="efficiency" aria-label="效率 E">
            <div class="pane-chart" id="efficiency-frame">
              <div class="chart-legend" id="efficiency-legend" data-feature="efficiency"></div>
              <div class="chart-surface" id="efficiency-chart"></div>
              <span class="sync-time-marker" id="efficiency-time-marker" aria-hidden="true"></span>
            </div>
          </section>

          <div class="pane-resizer" data-pane-resizer="direction" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="调整方向窗格高度"></div>
          <section class="pane feature-pane" data-pane-key="direction" aria-label="方向 D">
            <div class="pane-chart" id="direction-frame">
              <div class="chart-legend" id="direction-legend" data-feature="direction"></div>
              <div class="chart-surface" id="direction-chart"></div>
              <span class="sync-time-marker" id="direction-time-marker" aria-hidden="true"></span>
            </div>
          </section>

          <div class="pane-resizer" data-pane-resizer="twoSidedness" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="调整双向性窗格高度"></div>
          <section class="pane feature-pane" data-pane-key="twoSidedness" aria-label="双向性 B">
            <div class="pane-chart" id="two-sidedness-frame">
              <div class="chart-legend" id="two-sidedness-legend" data-feature="twoSidedness"></div>
              <div class="chart-surface" id="two-sidedness-chart"></div>
              <span class="sync-time-marker" id="two-sidedness-time-marker" aria-hidden="true"></span>
            </div>
          </section>

          <div class="pane-resizer" data-pane-resizer="expansion" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="调整当日扩张窗格高度"></div>
          <section class="pane feature-pane" data-pane-key="expansion" aria-label="当日扩张 X">
            <div class="pane-chart" id="expansion-frame">
              <div class="chart-legend" id="expansion-legend" data-feature="expansion"></div>
              <div class="chart-surface" id="expansion-chart"></div>
              <span class="sync-time-marker" id="expansion-time-marker" aria-hidden="true"></span>
            </div>
          </section>

          <div class="pane-resizer" data-pane-resizer="clearance" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="调整旧区位置窗格高度"></div>
          <section class="pane feature-pane" data-pane-key="clearance" aria-label="旧区位置 clearance">
            <div class="pane-chart" id="clearance-frame">
              <div class="chart-legend" id="clearance-legend" data-feature="clearance"></div>
              <div class="chart-surface" id="clearance-chart"></div>
              <span class="sync-time-marker" id="clearance-time-marker" aria-hidden="true"></span>
            </div>
          </section>
        </div>

        <aside class="snapshot-panel" id="snapshot-panel" aria-labelledby="snapshot-heading">
          <div class="snapshot-heading">
            <h2 id="snapshot-heading">当前读数</h2>
            <span class="as-of-readout" id="as-of-readout"></span>
          </div>
          <dl class="snapshot-values" id="snapshot-values"></dl>
        </aside>
      </section>

      <div class="loading-state" id="loading-state" role="status">正在加载冻结研究数据</div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
